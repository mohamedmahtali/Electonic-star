spring:
  application:
    name: electronic-star-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/electronicstar
    username: electronicstar
    password: electronicstar
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  cache:
    type: redis

server:
  port: 8080
  servlet:
    context-path: /

crawler:
  amazon:
    access-key: ${AMAZON_ACCESS_KEY:}
    secret-key: ${AMAZON_SECRET_KEY:}
    partner-tag: ${AMAZON_PARTNER_TAG:}
  cdiscount:
    app-key: ${CDISCOUNT_APP_KEY:}
    login: ${CDISCOUNT_LOGIN:}
    password: ${CDISCOUNT_PASSWORD:}

logging:
  level:
    fr.electronicstar: INFO
    org.springframework.cache: DEBUG
    org.hibernate.SQL: WARN
